name: Publish archive to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: steel-maiden-browser
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: steel-maiden-browser/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run verify:atlas-team && npm run verify:technology-paths
      - run: npm run build:pages && npm run verify:pages
        env:
          ARCHIVE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run audit:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: steel-maiden-browser/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
